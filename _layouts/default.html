<!DOCTYPE html>
<html lang="en-US">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script>
  // Click-to-play videos (see _includes/video-embed.html): swap the thumbnail for the YouTube player.
  document.addEventListener("click", function (e) {
    var link = e.target.closest && e.target.closest(".video-facade");
    if (!link) { return; }
    e.preventDefault();
    var frame = document.createElement("iframe");
    frame.src = "https://www.youtube-nocookie.com/embed/" + link.getAttribute("data-youtube") + "?autoplay=1&rel=0";
    frame.title = link.getAttribute("data-title");
    frame.allow = "autoplay; encrypted-media; picture-in-picture";
    frame.allowFullscreen = true;
    link.parentNode.replaceChild(frame, link);
  });
</script>
</body>
</html>
